name: Deploy Backend to Azure Functions

on:
  push:
    branches: [main]
    paths:
      - 'habitat-ai-backend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install & Build
        run: |
          cd habitat-ai-backend
          npm ci || npm install
          npm run build --if-present

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          package: habitat-ai-backend
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

      - name: Set App Settings
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az functionapp config appsettings set \
              --name ${{ secrets.AZURE_FUNCTIONAPP_NAME }} \
              --resource-group rg-habitat-ai-dev \
              --settings \
              CosmosDbConnectionString='${{ secrets.COSMOS_DB_CONNECTION_STRING }}' \
              StorageConnectionString='${{ secrets.STORAGE_CONNECTION_STRING }}' \
              VisionEndpoint='${{ secrets.VISION_ENDPOINT }}' \
              VisionKey='${{ secrets.VISION_KEY }}'
